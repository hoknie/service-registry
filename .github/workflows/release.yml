# A tag vX.Y.Z[-pre] naming the version in internal/app/version.go: the gates (ci.yml), the Linux
# packages for amd64 and arm64 (archive, deb, rpm; install checks on amd64), the macOS universal
# archive and .pkg (checked against a local Postgres), then the image ghcr.io/<owner>/<repo> for
# linux/amd64 and linux/arm64 and the GitHub Release with SHA256SUMS and the CHANGELOG.md section
# of the version. Nothing is published unless every check passed (ADR-0068).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JUST_VERSION: 1.58.0
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag names the version in internal/app/version.go
        run: ./packaging/release.sh check-tag "$TAG"

  gates:
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      skip-packages: true

  web:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: The interface in every language, with .gz siblings
        run: just web-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-out
          path: web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: [gates, web]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        target: [amd64, arm64]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-out
          path: web/out
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Static binary and archive
        run: just package
      - name: deb (debian:12) and rpm (almalinux:9)
        run: |
          just package-deb
          just package-rpm
      - name: The deb installs, runs, signs admin in and is removed on a clean debian:12
        if: matrix.target == 'amd64'
        run: timeout -s KILL 600 just package-check deb
      - name: The rpm installs, runs, signs admin in and is removed on a clean almalinux:9
        if: matrix.target == 'amd64'
        run: timeout -s KILL 600 just package-check rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: [gates, web]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-out
          path: web/out
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: A local Postgres for the package check
        run: |
          brew install --quiet postgresql@17
          brew services start postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          for _ in $(seq 1 60); do "$bin/pg_isready" -q -h 127.0.0.1 && break; sleep 1; done
          "$bin/createdb" -h 127.0.0.1 registry
          echo "CHECK_DATABASE_URL=postgres://$(id -un)@127.0.0.1:5432/registry?sslmode=disable" >> "$GITHUB_ENV"
      - name: A universal binary, its archive and the .pkg, checked
        run: ./packaging/package-macos.sh all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=svc-registry
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: env/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
      - name: The image says the version
        run: |
          version="${TAG#v}"
          answer="$(docker run --rm --platform linux/amd64 "ghcr.io/${GITHUB_REPOSITORY}:${version}" version)"
          echo "$answer"
          [ "$answer" = "svc-registry $version" ]

  publish:
    needs: [linux, macos, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release
          pattern: packages-*
          merge-multiple: true
      - name: SHA256SUMS
        run: ./packaging/release.sh checksums
      - name: Publish
        run: |
          ./packaging/release.sh notes > "$RUNNER_TEMP/release-notes.md"
          case "$TAG" in
          *-*) marking=(--prerelease) ;;
          *) marking=(--latest) ;;
          esac
          assets=(dist/release/svc-registry_* dist/release/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" \
              --title "svc-registry $TAG" \
              --verify-tag \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${marking[@]}" \
              "${assets[@]}"
          fi
