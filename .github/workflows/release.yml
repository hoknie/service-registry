# A tag vX.Y.Z[-pre] naming the version in internal/app/version.go: the gates (ci.yml), the Linux
# packages for amd64 and arm64 (archive, deb, rpm; install checks on amd64), the macOS universal
# archive and .pkg (checked against a local Postgres), then the image ghcr.io/<owner>/<repo> for
# linux/amd64 and linux/arm64 and the GitHub Release with SHA256SUMS and the CHANGELOG.md section
# of the version. Nothing is published unless every check passed (ADR-0068).
# The macOS binary and .pkg are signed with Developer ID and the .pkg notarized when the environment
# `release` (tags v* only) holds the secrets MACOS_CERTIFICATES_P12, MACOS_CERTIFICATES_PASSWORD,
# MACOS_SIGN_APPLICATION, MACOS_SIGN_INSTALLER, MACOS_NOTARY_KEY_P8, MACOS_NOTARY_KEY_ID,
# MACOS_NOTARY_ISSUER_ID and the variable MACOS_TEAM_ID; without them the .pkg is unsigned and the
# release notes say so (ADR-0080, docs/install.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JUST_VERSION: 1.58.0
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag names the version in internal/app/version.go
        run: ./packaging/release.sh check-tag "$TAG"

  gates:
    needs: check
    uses: ./.github/workflows/ci.yml

  web:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: The interface in every language, with .gz siblings
        run: just web-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-out
          path: web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: [gates, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: [amd64, arm64]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-out
          path: web/out
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Static binary and archive
        run: just package
      - name: deb (debian:12) and rpm (almalinux:9)
        run: |
          just package-deb
          just package-rpm
      - name: The deb installs, runs, signs admin in and is removed on a clean debian:12
        if: matrix.target == 'amd64'
        run: timeout -s KILL 600 just package-check deb
      - name: The rpm installs, runs, signs admin in and is removed on a clean almalinux:9
        if: matrix.target == 'amd64'
        run: timeout -s KILL 600 just package-check rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: [gates, web]
    runs-on: macos-14
    timeout-minutes: 60
    environment: release
    outputs:
      signed: ${{ steps.keychain.outputs.signed }}
    env:
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-out
          path: web/out
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: A local Postgres for the package check
        run: |
          brew install --quiet postgresql@17
          brew services start postgresql@17
          bin="$(brew --prefix postgresql@17)/bin"
          for _ in $(seq 1 60); do "$bin/pg_isready" -q -h 127.0.0.1 && break; sleep 1; done
          "$bin/createdb" -h 127.0.0.1 registry
          echo "CHECK_DATABASE_URL=postgres://$(id -un)@127.0.0.1:5432/registry?sslmode=disable" >> "$GITHUB_ENV"
      - name: Signing keychain
        id: keychain
        env:
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          if [ -z "$MACOS_CERTIFICATES_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "no signing secrets: the .pkg is built unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          umask 077
          printf '%s' "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          search=("$keychain"); while IFS= read -r known; do search+=("$known"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "${search[@]}"
          printf '%s' "$MACOS_NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          chmod 0600 "$RUNNER_TEMP/notary.p8"
          {
            echo "MACOS_KEYCHAIN=$keychain"
            echo "MACOS_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: A universal binary (arm64 + amd64)
        env: &signing
          MACOS_SIGN_APPLICATION: ${{ secrets.MACOS_SIGN_APPLICATION }}
          MACOS_SIGN_INSTALLER: ${{ secrets.MACOS_SIGN_INSTALLER }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./packaging/package-macos.sh binaries
      - name: The archive
        run: ./packaging/package-macos.sh archive
      - name: The .pkg, signed and notarized when the secrets are set
        env: *signing
        run: ./packaging/package-macos.sh pkg
      - name: The .pkg holds what it should, its signature checks out, the service starts and admin signs in
        timeout-minutes: 10
        env: *signing
        run: ./packaging/package-macos.sh check
      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificates.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=svc-registry
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: env/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
      - name: The image says the version
        run: |
          version="${TAG#v}"
          answer="$(docker run --rm --platform linux/amd64 "ghcr.io/${GITHUB_REPOSITORY}:${version}" version)"
          echo "$answer"
          [ "$answer" = "svc-registry $version" ]

  publish:
    needs: [linux, macos, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          pattern: packages-*
          merge-multiple: true
      - name: SHA256SUMS
        run: ./packaging/release.sh checksums
      - name: Publish
        env:
          MACOS_SIGNED: ${{ needs.macos.outputs.signed }}
        run: |
          ./packaging/release.sh notes > "$RUNNER_TEMP/release-notes.md"
          if [ "$MACOS_SIGNED" != true ]; then
            printf '\nThe macOS package is not signed; see docs/install.md\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          case "$TAG" in
          *-*) marking=(--prerelease) ;;
          *) marking=(--latest) ;;
          esac
          assets=(dist/release/svc-registry_* dist/release/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" \
              --title "svc-registry $TAG" \
              --verify-tag \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${marking[@]}" \
              "${assets[@]}"
          fi
