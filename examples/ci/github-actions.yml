# A step to append to your deploy job in .github/workflows/*.yml (spec ingest/events).
# Settings → Secrets and variables → Actions:
#   variable SVCR_URL         = https://registry.example.com
#   variable SVCR_PROJECT_ID  = <project id from the catalog page>
#   secret   SVCR_PROJECT_KEY = svcr_… (a key of that project)
# Empty optional fields (e.g. url) are treated as unset by the registry.
- name: Register the deployment in svc-registry
  env:
    SVCR_URL: ${{ vars.SVCR_URL }}
    SVCR_PROJECT_ID: ${{ vars.SVCR_PROJECT_ID }}
    SVCR_PROJECT_KEY: ${{ secrets.SVCR_PROJECT_KEY }}
    ENVIRONMENT: production
  run: |
    OCCURRED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    curl --fail-with-body --retry 3 --retry-all-errors -X POST \
      "$SVCR_URL/api/v1/ingest/projects/$SVCR_PROJECT_ID/events" \
      -H "Authorization: Bearer $SVCR_PROJECT_KEY" \
      -H "Content-Type: application/json" \
      --data @- <<EOF
    {
      "type": "service.deployed",
      "version": 1,
      "occurred_at": "$OCCURRED_AT",
      "idempotency_key": "gh-${{ github.run_id }}-${{ github.run_attempt }}-$ENVIRONMENT",
      "payload": {
        "service": "my-service",
        "version": "${{ github.sha }}",
        "environment": "$ENVIRONMENT",
        "commit_sha": "${{ github.sha }}",
        "branch": "${{ github.ref_name }}",
        "url": "https://my-service.example.com",
        "deployed_by": "${{ github.actor }}",
        "metadata": { "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
      }
    }
    EOF
